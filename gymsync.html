<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GymSync — Smart Gym Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#080808;--sf:#0f0f0f;--card:#161616;--bd:#252525;--ac:#c8ff00;--acd:rgba(200,255,0,.1);--tx:#f0f0f0;--mu:#666;--dg:#ff3b3b;--wn:#ffb800;--ok:#00e676;--r:10px;--sw:240px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
/* Auth */
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.auth-wrap{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:40px;width:400px;max-width:92vw}
.al{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.al .icon{width:36px;height:36px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.al h1{font-size:22px;font-weight:900;letter-spacing:-1px}
.al em{color:var(--ac);font-style:normal}
.auth-wrap h2{font-size:18px;font-weight:700;margin-bottom:4px}
.auth-wrap>p{color:var(--mu);font-size:12px;margin-bottom:24px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.role-btn{padding:14px 10px;background:var(--sf);border:2px solid var(--bd);border-radius:10px;cursor:pointer;text-align:center;transition:.15s;color:var(--tx)}
.role-btn h3{font-size:13px;font-weight:700;margin-bottom:2px}
.role-btn p{font-size:11px;color:var(--mu)}
.role-btn.sel{border-color:var(--ac);background:var(--acd)}
/* Forms */
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-bottom:5px;letter-spacing:.3px}
.f input,.f select,.f textarea{width:100%;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.f select option{background:var(--card)}
.f textarea{resize:vertical;min-height:70px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.15s;font-family:inherit;white-space:nowrap}
.bp{background:var(--ac);color:#000}.bp:hover{background:#dfff00}
.bg{background:transparent;color:var(--tx);border:1px solid var(--bd)}.bg:hover{border-color:var(--ac);color:var(--ac)}
.bd{background:rgba(255,59,59,.12);color:var(--dg);border:1px solid rgba(255,59,59,.2)}.bd:hover{background:rgba(255,59,59,.2)}
.bs{background:rgba(0,230,118,.1);color:var(--ok);border:1px solid rgba(0,230,118,.2)}
.bsm{padding:6px 12px;font-size:11px}
.bfull{width:100%;justify-content:center}
/* App layout */
#app{display:none;height:100vh;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:50;transition:transform .25s}
.sbl{padding:18px 16px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sbl .ico{width:28px;height:28px;background:var(--ac);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sbl span{font-size:16px;font-weight:900;letter-spacing:-.5px}
.sbl em{color:var(--ac);font-style:normal}
.srole{margin:10px 12px;padding:5px 10px;background:var(--acd);border:1px solid rgba(200,255,0,.15);border-radius:6px;font-size:10px;font-weight:700;color:var(--ac);letter-spacing:.5px}
.snav{flex:1;overflow-y:auto;padding:6px 8px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mu);font-size:12px;font-weight:500;transition:.12s;margin-bottom:1px}
.ni:hover{background:var(--card);color:var(--tx)}
.ni.active{background:var(--acd);color:var(--ac);border:1px solid rgba(200,255,0,.12)}
.ni svg{width:15px;height:15px;flex-shrink:0}
.sfoot{padding:14px;border-top:1px solid var(--bd)}
.uc{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--card);border-radius:8px;border:1px solid var(--bd)}
.uav{width:30px;height:30px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000;flex-shrink:0}
.un{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ue{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{margin-left:var(--sw);height:100vh;overflow-y:auto;padding:24px}
.ph{margin-bottom:22px}
.ph h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.ph p{color:var(--mu);font-size:12px;margin-top:3px}
/* Stats */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.sl{font-size:10px;color:var(--mu);font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.sv{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1}
.sd{font-size:10px;margin-top:5px;color:var(--mu)}
.sc.a .sv{color:var(--ac)}.sc.d .sv{color:var(--dg)}.sc.w .sv{color:var(--wn)}.sc.g .sv{color:var(--ok)}
/* Charts */
.cg{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:20px}
.cc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.cc h3{font-size:13px;font-weight:600;margin-bottom:14px}
.cw{position:relative;height:190px}
/* Table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;color:var(--mu);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--bd);letter-spacing:.4px}
td{padding:11px 12px;border-bottom:1px solid var(--bd);font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
/* Card */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r)}
.ch{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ch h3{font-size:13px;font-weight:600}
.cb{padding:18px}
/* Badge */
.b{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bg-ok{background:rgba(0,230,118,.12);color:var(--ok)}
.bg-dg{background:rgba(255,59,59,.12);color:var(--dg)}
.bg-wn{background:rgba(255,184,0,.12);color:var(--wn)}
.bg-mu{background:rgba(255,255,255,.07);color:var(--mu)}
.bg-ac{background:var(--acd);color:var(--ac)}
/* Modal */
.mbo{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.mo{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:520px;max-width:100%;max-height:88vh;overflow-y:auto}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.mh h2{font-size:15px;font-weight:700}
.mbody{padding:22px}
.mfoot{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px}
.xbtn{background:none;border:none;color:var(--mu);cursor:pointer;font-size:20px;line-height:1;padding:2px}
.xbtn:hover{color:var(--tx)}
/* Misc */
.flex{display:flex}.fbet{display:flex;align-items:center;justify-content:space-between}.gap{gap:10px}
.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.tmu{color:var(--mu)}.tac{color:var(--ac)}.tsm{font-size:11px}
.es{text-align:center;padding:48px 20px;color:var(--mu)}
.es p{font-size:13px;margin-top:8px}
.sb{display:flex;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:0 12px;gap:8px;flex:1;min-width:200px}
.sb input{background:none;border:none;color:var(--tx);padding:9px 0;font-size:12px;outline:none;flex:1;font-family:inherit}
.tb{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mav{width:34px;height:34px;border-radius:50%;background:var(--acd);border:1px solid rgba(200,255,0,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--ac);flex-shrink:0}
.pb{background:var(--bd);border-radius:99px;height:5px;overflow:hidden;margin-top:6px}
.pf{height:100%;background:var(--ac);border-radius:99px}
/* Mobile topbar */
.topbar{display:none;position:fixed;top:0;left:0;right:0;height:54px;background:var(--sf);border-bottom:1px solid var(--bd);align-items:center;justify-content:space-between;padding:0 14px;z-index:60}
.hbg{background:none;border:none;color:var(--tx);cursor:pointer;padding:6px;font-size:20px}
.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:49}
/* Store */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:.15s}
.pc:hover{border-color:rgba(200,255,0,.3)}
.pi{height:130px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-size:48px}
.pif{padding:12px}
.pn{font-size:12px;font-weight:700;margin-bottom:3px}
.pbr{font-size:10px;color:var(--mu);margin-bottom:8px}
.ppr{font-size:17px;font-weight:900;color:var(--ac)}
.pst{font-size:10px;color:var(--mu)}
/* QR */
.qrc{display:flex;flex-direction:column;align-items:center;padding:28px;background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:300px;margin:0 auto}
.qrw{background:#fff;padding:14px;border-radius:8px;margin-bottom:14px}
/* Membership card */
.mc{background:linear-gradient(135deg,#161616,#1e1e1e);border:1px solid var(--ac);border-radius:14px;padding:22px;position:relative;overflow:hidden;margin-bottom:16px}
.mc::after{content:'';position:absolute;top:-50px;right:-50px;width:130px;height:130px;background:var(--acd);border-radius:50%}
.mcp{font-size:11px;color:var(--ac);font-weight:700;margin-bottom:6px}
.mcn{font-size:18px;font-weight:900;margin-bottom:14px}
.mcr{display:flex;justify-content:space-between;margin-bottom:8px}
.mcr span{font-size:10px;color:var(--mu)}.mcr strong{font-size:12px;font-weight:600}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:18px}
.tb2{padding:7px 14px;background:none;border:none;color:var(--mu);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
.tb2.active{color:var(--tx);border-bottom-color:var(--ac)}
/* Notif */
.ni2{padding:14px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:flex-start}
.ni2:last-child{border-bottom:none}
.ni2.unr{background:rgba(200,255,0,.025)}
.ndot{width:7px;height:7px;background:var(--ac);border-radius:50%;flex-shrink:0;margin-top:5px}
/* Timeline */
.tline{padding:0 0 20px 20px;border-left:2px solid var(--bd)}
.te{position:relative;margin-bottom:20px}
.te::before{content:'';position:absolute;left:-25px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
/* Info rows */
.ir{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.ir:last-child{border-bottom:none}
.ir .irl{font-size:12px;color:var(--mu)}.ir .irv{font-size:12px;font-weight:600}
/* Cart */
.ci{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.ci:last-child{border-bottom:none}
.cbdg{background:var(--dg);color:#fff;border-radius:50%;width:17px;height:17px;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
/* Detail header */
.dh{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.dav{width:64px;height:64px;border-radius:50%;background:var(--acd);border:2px solid rgba(200,255,0,.3);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--ac);flex-shrink:0}
/* Scanner */
.scanner-box{background:var(--card);border:2px dashed var(--bd);border-radius:14px;padding:40px;text-align:center;max-width:460px;margin:0 auto}
.scan-result{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:20px;max-width:400px;margin:16px auto 0}
/* Alert */
.alert{padding:12px 16px;border-radius:8px;font-size:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.alert-ok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.2);color:var(--ok)}
.alert-wn{background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.2);color:var(--wn)}
.alert-dg{background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.2);color:var(--dg)}
/* Settings */
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Report numbers */
.rbig{font-size:36px;font-weight:900;color:var(--ac);letter-spacing:-2px}
/* Responsive */
@media(max-width:768px){
.topbar{display:flex}
.sidebar{transform:translateX(-100%);top:0}
.sidebar.open{transform:translateX(0)}
.sov.open{display:block}
.main{margin-left:0;padding:68px 14px 20px}
.cg{grid-template-columns:1fr}
.sg{grid-template-columns:1fr 1fr}
.row-2{grid-template-columns:1fr}
.sg2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
<div class="auth-wrap">
  <div class="al">
    <div class="icon">💪</div>
    <h1>Gym<em>Sync</em></h1>
  </div>
  <h2>Welcome back</h2>
  <p>Your Gym. Your Members. One Smart System.</p>
  <div class="role-pick" id="rolePick">
    <div class="role-btn sel" onclick="GS.pickRole('owner',this)">
      <div style="font-size:22px;margin-bottom:4px">🏢</div>
      <h3>Gym Owner</h3>
      <p>Admin panel</p>
    </div>
    <div class="role-btn" onclick="GS.pickRole('member',this)">
      <div style="font-size:22px;margin-bottom:4px">🏋️</div>
      <h3>Member</h3>
      <p>Member portal</p>
    </div>
  </div>
  <div class="f"><label>EMAIL</label><input type="email" id="loginEmail" value="owner@gymsync.com" placeholder="your@email.com"></div>
  <div class="f" style="margin-bottom:20px"><label>PASSWORD</label><input type="password" id="loginPw" value="gym123" placeholder="••••••••"></div>
  <div id="loginErr" style="display:none" class="alert alert-dg">❌ Invalid credentials</div>
  <button class="btn bp bfull" onclick="GS.login()" style="margin-bottom:16px">Sign In →</button>
  <p style="text-align:center;color:var(--mu);font-size:11px">Demo: <strong style="color:var(--ac)">owner@gymsync.com</strong> or <strong style="color:var(--ac)">john@gymsync.com</strong> / password: <strong style="color:var(--ac)">gym123</strong></p>
</div>
</div>

<!-- APP -->
<div id="app">
<div class="sov" id="sov" onclick="GS.closeSidebar()"></div>
<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sbl">
    <div class="ico">💪</div>
    <span>Gym<em>Sync</em></span>
  </div>
  <div class="srole" id="sideRole">OWNER PANEL</div>
  <div class="snav" id="sideNav"></div>
  <div class="sfoot">
    <div id="syncDot" style="font-size:10px;color:var(--mu);text-align:center;padding:5px 0 8px;letter-spacing:.2px">💾 Local only</div>
    <div class="uc">
      <div class="uav" id="sideAv">O</div>
      <div style="flex:1;min-width:0">
        <div class="un" id="sideUN">Owner</div>
        <div class="ue" id="sideUE">owner@gymsync.com</div>
      </div>
    </div>
  </div>
</nav>
<!-- Mobile topbar -->
<div class="topbar">
  <button class="hbg" onclick="GS.openSidebar()">☰</button>
  <span style="font-size:15px;font-weight:800">Gym<em style="color:var(--ac)">Sync</em></span>
  <button class="btn bg bsm" onclick="GS.logout()">Out</button>
</div>
<!-- Main content -->
<main class="main" id="main"></main>
</div>

<!-- Modal -->
<div id="mCon" style="display:none" class="mbo" onclick="if(event.target===this)GS.closeModal()"></div>

<script>
const GS = {
 role:'owner', page:'dashboard', cart:[], user:null, chartInst:{}, sb:null, sbReady:false,

 // ── DB helpers ──────────────────────────────────────────────
 get(k){try{return JSON.parse(localStorage.getItem('gs_'+k)||'[]')}catch{return[]}},
 set(k,d){localStorage.setItem('gs_'+k,JSON.stringify(d));this.pushCloud(k,d);},
 uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)},

 // ── Supabase cloud sync ──────────────────────────────────────
 initSB(){
  const url=localStorage.getItem('gs_sb_url')||'';
  const key=localStorage.getItem('gs_sb_key')||'';
  if(url&&key&&typeof supabase!=='undefined'){
   try{this.sb=supabase.createClient(url,key);this.sbReady=true;return true;}
   catch(e){console.error('Supabase init error',e);}
  }
  this.sbReady=false;return false;
 },
 async syncDown(){
  if(!this.sb)return;
  this.dot('🔄 Syncing…','var(--mu)');
  try{
   const{data,error}=await this.sb.from('app_data').select('*');
   if(error)throw error;
   (data||[]).forEach(r=>localStorage.setItem('gs_'+r.id,JSON.stringify(r.data)));
   this.dot('☁️ Cloud synced','var(--ok)');
  }catch(e){console.error(e);this.dot('⚠️ Sync error','var(--dg)');}
 },
 dot(txt,color){const el=document.getElementById('syncDot');if(el){el.textContent=txt;el.style.color=color;}},
 pushCloud(k,d){
  if(!this.sb)return;
  this.sb.from('app_data').upsert({id:k,data:d,updated_at:new Date().toISOString()},{onConflict:'id'})
   .then(({error})=>{if(error){console.error(error);this.dot('⚠️ Not saved','var(--dg)');}else this.dot('☁️ Saved','var(--ok)');});
 },
 async testSBConnection(url,key){
  try{
   const c=supabase.createClient(url,key);
   const{error}=await c.from('app_data').select('id').limit(1);
   return !error;
  }catch{return false;}
 },

 // ── Seed demo data ───────────────────────────────────────────
 seed(){
  if(localStorage.getItem('gs_seeded'))return;
  const gid='gym1';
  const now=new Date();
  const d=(n)=>new Date(now.getTime()+n*86400000).toISOString().split('T')[0];

  this.set('users',[
   {id:'u1',email:'owner@gymsync.com',pw:'gym123',role:'owner',name:'Rahul Sharma',gid,phone:'9876543210'},
   {id:'u2',email:'john@gymsync.com',pw:'gym123',role:'member',name:'John Doe',gid,phone:'9871234560'},
   {id:'u3',email:'priya@gymsync.com',pw:'gym123',role:'member',name:'Priya Patel',gid,phone:'9870000001'},
   {id:'u4',email:'arjun@gymsync.com',pw:'gym123',role:'member',name:'Arjun Singh',gid,phone:'9870000002'},
   {id:'u5',email:'meera@gymsync.com',pw:'gym123',role:'member',name:'Meera Nair',gid,phone:'9870000003'},
   {id:'u6',email:'vikram@gymsync.com',pw:'gym123',role:'member',name:'Vikram Bose',gid,phone:'9870000004'},
  ]);
  this.set('plans',[
   {id:'p1',gid,name:'Monthly',months:1,price:999,desc:'Full access for 1 month',benefits:'All equipment, Locker'},
   {id:'p2',gid,name:'Quarterly',months:3,price:2499,desc:'Best value for 3 months',benefits:'All equipment, Locker, 1 PT session'},
   {id:'p3',gid,name:'Half-Yearly',months:6,price:4499,desc:'6 months full access',benefits:'All equipment, Locker, 2 PT sessions, Supplements discount'},
   {id:'p4',gid,name:'Yearly',months:12,price:7999,desc:'Best annual deal',benefits:'All equipment, Locker, 5 PT sessions, Supplement discount 10%'},
  ]);

 pickRole(r,el){

 },
 login(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw=document.getElementById('loginPw').value;
  const users=this.get('users');
  const u=users.find(x=>x.email.toLowerCase()===email&&x.pw===pw);
  const err=document.getElementById('loginErr');
  if(!u){err.style.display='flex';return;}
  err.style.display='none';
  this.user=u;
  this.role=u.role;
  this.page=u.role==='owner'?'dashboard':'home';
  this.cart=[];
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='block';
  this.renderSidebar();
  this.initSB();
  if(this.sb){
   this.dot('🔄 Syncing…','var(--mu)');
   this.syncDown().then(()=>this.render());
  }else{
   this.render();
   this.dot('💾 Local only','var(--mu)');
  }
 },
 logout(){
  this.user=null;this.cart=[];
  document.getElementById('app').style.display='none';

  Object.values(this.chartInst).forEach(c=>{try{c.destroy();}catch{}});

 },

 daysLeft(end){

  this.showModal('Update Stock — '+p.name,`
   <div style="text-align:center;background:var(--sf);border-radius:10px;padding:16px;margin-bottom:16px">
    <div style="font-size:40px;font-weight:900;color:var(--ac);letter-spacing:-2px">${p.stock}</div>
    <div class="tsm tmu">current stock (units)</div>
   </div>

   <div style="text-align:center;color:var(--mu);font-size:11px;margin:-6px 0 12px">— ya fir add/remove karo —</div>
   <div class="f"><label>ADD / REMOVE UNITS (+ ya - enter karo)</label><input id="sadd" type="number" placeholder="e.g. +10 ya -5"></div>`,
  ()=>{
   const newRaw=document.getElementById('snew').value.trim();
   const addRaw=document.getElementById('sadd').value.trim();
   let finalStock=p.stock;
   if(newRaw!==''){finalStock=Math.max(0,parseInt(newRaw)||0);}
   else if(addRaw!==''){finalStock=Math.max(0,p.stock+(parseInt(addRaw)||0));}
   else{this.toast('Koi value enter karo','dg');return;}
   const products=this.get('products');
   const idx=products.findIndex(x=>x.id===id);
   if(idx<0){this.closeModal();return;}
   products[idx]=Object.assign({},products[idx],{stock:finalStock});
   this.set('products',products);
   this.closeModal();
   this.rInventory();
  },'Update Stock');
 },
 deleteProduct(id){

  this.confirmModal('Delete Product',`<strong>${p.name}</strong> ko inventory se hata do? Ye undo nahi hoga.`,()=>{

 // ── Streak calculation ───────────────────────────────────────
 calcStreak(mid){
  const att=this.get('attendance').filter(a=>a.mid===mid);
  // Always use ISO UTC string for dates — consistent with stored values
  const getD=(n)=>new Date(Date.now()-n*86400000).toISOString().split('T')[0];
  const dset=new Set(att.map(a=>a.date));
  if(!dset.size)return{current:0,best:0,dates:[]};

  // Current streak: start from today; if today absent, try yesterday (might not have checked in yet)
  let cur=0;
  const off=dset.has(getD(0))?0:dset.has(getD(1))?1:null;
  if(off!==null) for(let i=off;i<400&&dset.has(getD(i));i++)cur++;

  // Best streak: sort asc, count longest consecutive run
  const sorted=[...dset].sort();
  let best=Math.max(cur,sorted.length?1:0),run=1;
  for(let i=1;i<sorted.length;i++){
   const diff=Math.round((new Date(sorted[i])-new Date(sorted[i-1]))/86400000);
   if(diff===1){run++;if(run>best)best=run;}else run=1;
  }
  return{current:cur,best,dates:[...dset].sort((a,b)=>b.localeCompare(a))};
 },

 streakCard(mid){
  const{current,best,dates}=this.calcStreak(mid);
  const days=['S','M','T','W','T','F','S'];
  const dots=Array.from({length:7},(_,i)=>{
   const dt=new Date(Date.now()-(6-i)*86400000);
   const str=dt.toISOString().split('T')[0]; // UTC — matches stored dates
   const hit=dates.includes(str);
   const isToday=i===6;
   return`<div style="display:flex;flex-direction:column;align-items:center;gap:5px">
    <div style="width:36px;height:36px;border-radius:50%;background:${hit?'var(--ac)':'var(--bd)'};border:2px solid ${hit?'var(--ac)':isToday?'rgba(200,255,0,.3)':'var(--bd)'};display:flex;align-items:center;justify-content:center;font-size:16px">${hit?'✓':''}</div>
    <span style="font-size:9px;font-weight:600;color:${isToday?'var(--ac)':'var(--mu)'}">${days[dt.getDay()]}</span>
   </div>`;
  }).join('');
  const checkedToday=dates.includes(new Date().toISOString().split('T')[0]);
  const todayLine=checkedToday
   ?'<span style="font-size:11px;color:var(--ok);font-weight:600">✅ Checked in today</span>'
   :'<span style="font-size:11px;color:var(--wn);font-weight:600">⚠️ Not checked in today yet</span>';
  const msg=current===0?'Check in to start your streak! 💪':current===1?'Day 1 — great start! 🌟':current<5?'Building momentum! 🔥':current<14?'You\'re on fire! Keep going! 🔥🔥':current<30?'Two weeks strong! Beast mode! 🏆':'Legend status! 🔥🏆🔥';
  const flame=current===0?'⚫':current<3?'🔥':current<7?'🔥':current<14?'🔥🔥':'🔥🔥🔥';
  return`<div style="background:linear-gradient(135deg,#111,#1a1a1a);border:1px solid ${current>0?'rgba(200,255,0,.3)':'var(--bd)'};border-radius:14px;padding:22px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden">
   ${current>0?`<div style="position:absolute;top:-20px;right:-20px;font-size:80px;opacity:.07">${flame}</div>`:''}
   <div style="font-size:36px;margin-bottom:4px">${current>0?flame:'💤'}</div>
   <div style="font-size:52px;font-weight:900;letter-spacing:-3px;line-height:1;color:${current>0?'var(--ac)':'var(--mu)'};margin-bottom:4px">${current}</div>
   <div style="font-size:14px;font-weight:600;color:var(--mu);margin-bottom:4px">day streak</div>
   <div style="font-size:11px;color:${current>0?'var(--ac)':'var(--mu)'};margin-bottom:8px">${msg}</div>
   <div style="margin-bottom:14px">${todayLine}</div>
   <div style="display:flex;justify-content:center;gap:8px;margin-bottom:14px">${dots}</div>
   <div style="display:flex;justify-content:center;gap:24px">
    <div><div style="font-size:11px;color:var(--mu)">Best Streak</div><div style="font-size:18px;font-weight:800;color:var(--wn)">${best} days</div></div>
    <div style="width:1px;background:var(--bd)"></div>
    <div><div style="font-size:11px;color:var(--mu)">Total Check-ins</div><div style="font-size:18px;font-weight:800">${dates.length}</div></div>
   </div>
  </div>`;
 },

 selfCheckIn(){

 // ── Attendance migration – give demo member a real streak ───
 migrateAtt(){
  // Runs once per calendar day — keeps demo streak fresh & current
  const today=new Date().toISOString().split('T')[0];
  if(localStorage.getItem('gs_att_'+today))return;
  const att=this.get('attendance');
  // i starts at 1 (yesterday) — today (i=0) is NEVER auto-added.
  // Member must manually check in for today. That's what makes the streak real.
  for(let i=1;i<21;i++){
   const dt=new Date(Date.now()-i*86400000).toISOString().split('T')[0];
   if(!att.some(a=>a.mid==='m1'&&a.date===dt))
    att.push({id:this.uid(),gid:'gym1',mid:'m1',mname:'John Doe',date:dt,time:['06:30','07:00','07:15','08:00'][i%4],self:true});
   if(i<7&&!att.some(a=>a.mid==='m3'&&a.date===dt))
    att.push({id:this.uid(),gid:'gym1',mid:'m3',mname:'Arjun Singh',date:dt,time:'06:00',self:true});
  }
  this.set('attendance',att);
  localStorage.setItem('gs_att_'+today,'1');
 },
 init(){
